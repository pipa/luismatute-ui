<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sky fixture</title>
    <script src="../ui/theme-init.js"></script>
    <link rel="stylesheet" href="../ui/tokens.css" />
    <link rel="stylesheet" href="../ui/base.css" />
    <link rel="stylesheet" href="../ui/sky.css" />
    <link rel="stylesheet" href="./sky-tall.css" />
    <script type="module" src="./sky.js"></script>
  </head>
  <body>
    <lm-sky-header concept="cruise">
      <header class="lm-sky-head" id="top">
        <div class="lm-sky-inner">
          <nav class="lm-sky-nav" aria-label="Site">
            <a class="lm-sky-brand" href="./sky.html">Luis Matute</a>
            <ul>
              <li><a class="lm-pill" href="./sky.html" aria-current="page">Blog</a></li>
              <li class="lm-sky-controls">
                <lm-theme-toggle></lm-theme-toggle>
                <button type="button" class="lm-pill lm-pill--mono lm-sky-pause" aria-pressed="false"><span class="lm-i-pause" aria-hidden="true"></span><span class="lm-pl">Pause sky</span></button>
              </li>
            </ul>
          </nav>
          <div class="lm-sky-hero"><div><p class="lm-tag-kicker">In-flight notes</p><h1 class="lm-sky-title">Blog</h1></div></div>
        </div>
      </header>
    </lm-sky-header>
    <main class="tall fx-main">
      <h2 class="lm-year"><b>2016</b> 1 note</h2>
      <ol class="lm-stubs">
        <li>
          <article class="lm-ticket">
            <div class="lm-ticket-cover"><img src="./sky-cover.svg" alt="" width="300" height="200" /></div>
            <div class="lm-ticket-body">
              <p class="lm-ticket-kicker">Seat 2A · Flight LM1988</p>
              <h3 class="lm-ticket-title"><a href="./sky.html">Boarding pass fixture</a></h3>
              <p class="lm-ticket-desc">A ticket-stub card on paper by day and card at night.</p>
              <ul class="lm-chips"><li>Fixture</li></ul>
            </div>
          </article>
        </li>
      </ol>
      <pre class="fx-code"><code><span class="tok-comment">// code theme</span>
<span class="tok-keyword">const</span> <span class="tok-text">seat</span> <span class="tok-punct">=</span> <span class="tok-string">'2A'</span><span class="tok-punct">;</span>
<span class="tok-function">board</span><span class="tok-punct">(</span><span class="tok-number">1988</span><span class="tok-punct">);</span>
<span class="tok-punct">&lt;</span><span class="tok-tag">Pass</span> <span class="tok-attr">flight</span><span class="tok-punct">=</span><span class="tok-string">"LM1988"</span> <span class="tok-punct">/&gt;</span></code></pre>
    </main>
  </body>
</html>
