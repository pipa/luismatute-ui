<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Docs shell sheet</title>
    <script src="../mock/theme.js"></script>
    <link rel="stylesheet" href="../../../dist/tokens.css" />
    <link rel="stylesheet" href="../../../dist/fonts.css" />
    <link rel="stylesheet" href="./sheet.css" />
  </head>
  <body>
    <header>
      <p class="kicker">Muse · design for #18</p>
      <h1>Docs shell</h1>
      <p>Wheels up tokens. Light and dark. No new hues.</p>
    </header>
    <section>
      <h2>1440</h2>
      <div class="pair">
        <figure>
          <img src="./component-1440-light.png" alt="Component page, 1440, light" />
          <figcaption>Light</figcaption>
        </figure>
        <figure>
          <img src="./component-1440-dark.png" alt="Component page, 1440, dark" />
          <figcaption>Dark</figcaption>
        </figure>
      </div>
    </section>
    <section>
      <h2>1280</h2>
      <div class="pair">
        <figure>
          <img src="./component-1280-light.png" alt="Component page, 1280, light" />
          <figcaption>Light</figcaption>
        </figure>
        <figure>
          <img src="./component-1280-dark.png" alt="Component page, 1280, dark" />
          <figcaption>Dark</figcaption>
        </figure>
      </div>
    </section>
    <section>
      <h2>768 and 375</h2>
      <div class="quad">
        <figure>
          <img src="./component-768-light.png" alt="Component page, 768, light" />
          <figcaption>768 light</figcaption>
        </figure>
        <figure>
          <img src="./component-768-dark.png" alt="Component page, 768, dark" />
          <figcaption>768 dark</figcaption>
        </figure>
        <figure>
          <img src="./component-375-light.png" alt="Component page, 375, light" />
          <figcaption>375 light</figcaption>
        </figure>
        <figure>
          <img src="./component-375-dark.png" alt="Component page, 375, dark" />
          <figcaption>375 dark</figcaption>
        </figure>
      </div>
    </section>
    <section>
      <h2>Home, 404, drawer</h2>
      <div class="triple">
        <figure>
          <img src="./home-1440-light.png" alt="Home, 1440, light" />
          <figcaption>Home</figcaption>
        </figure>
        <figure>
          <img src="./404-1440-light.png" alt="404, 1440, light" />
          <figcaption>404</figcaption>
        </figure>
        <figure>
          <img src="./phone-drawer.png" alt="Phone drawer" />
          <figcaption>Phone drawer</figcaption>
        </figure>
      </div>
    </section>
    <section>
      <h2>States</h2>
      <div class="states">
        <figure>
          <img src="./theme-toggle.png" alt="Theme toggle" />
          <figcaption>Theme</figcaption>
        </figure>
        <figure>
          <img src="./code-idle.png" alt="Code block" />
          <figcaption>Code</figcaption>
        </figure>
        <figure>
          <img src="./copy-states.png" alt="Copy button states" />
          <figcaption>Copy states</figcaption>
        </figure>
        <figure>
          <img src="./token-copy.png" alt="Token copy chips" />
          <figcaption>Tokens</figcaption>
        </figure>
        <figure>
          <img src="./search-dialog.png" alt="Search results" />
          <figcaption>Search</figcaption>
        </figure>
        <figure>
          <img src="./search-empty.png" alt="Search empty" />
          <figcaption>Empty</figcaption>
        </figure>
      </div>
    </section>
  </body>
</html>
